<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Web Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <p class="label">DEMO PROJECT</p>

            <h1>Repository Clone Successful</h1>

            <p class="description">
                This is a simple static web project containing HTML,
                CSS, and JavaScript files.
            </p>

            <div class="status">
                <span class="status-indicator"></span>
                Project files loaded successfully
            </div>

            <div class="demo">
                <p>
                    Button presses:
                    <strong id="counter">0</strong>
                </p>

                <button id="demo-button" type="button">
                    Test JavaScript
                </button>
            </div>

            <p class="footer">
                No dependencies or external services are required.
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
